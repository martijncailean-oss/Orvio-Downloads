<!doctype html>
<!-- Where the links in Orvio's account e-mails land: published as confirmed.html in Orvio-Downloads (GitHub Pages).
     A browser cannot open orvio:// by itself from many mail apps, and not at all on a computer, which left a white page.
     The tokens in the address stay in this browser: nothing loads from elsewhere and nothing is sent anywhere. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="robots" content="noindex">
<title>Orvio</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #07080d; color: #f5f3ef; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; padding: 32px 24px; box-sizing: border-box; text-align: center; }
  .brand { color: #f2b33d; font-size: 30px; font-weight: 700; margin-bottom: 28px; }
  .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(242, 179, 61, .15); color: #f2b33d; }
  .mark.problem { background: rgba(229, 103, 95, .15); color: #e5675f; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #b4b6be; margin: 0 0 24px; }
  a.button { display: block; padding: 15px; border-radius: 14px; background: #f2b33d; color: #07080d; font-weight: 700; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">Orvio</div>
  <div class="mark" id="mark">✓</div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <a class="button" id="open" hidden></a>
</main>
<script>
  var words = {
    en: {
      confirmed: "Your e-mail address is confirmed", confirmedText: "Go back to Orvio: it signs you in by itself. If it asks, sign in with your e-mail and password.",
      recovery: "Choose a new password", recoveryApp: "Tap the button to choose your new password in Orvio.", recoveryOther: "Open this e-mail on the device that has Orvio, and tap the link there.",
      failed: "This link no longer works", failedText: "It was already used, or it is too old. Your address may already be confirmed: go back to Orvio and sign in. If that does not work, ask for a new e-mail there.",
      open: "Open Orvio"
    },
    nl: {
      confirmed: "Je e-mailadres is bevestigd", confirmedText: "Ga terug naar Orvio: je wordt vanzelf ingelogd. Vraagt de app erom, log dan in met je e-mailadres en wachtwoord.",
      recovery: "Kies een nieuw wachtwoord", recoveryApp: "Tik op de knop om in Orvio je nieuwe wachtwoord te kiezen.", recoveryOther: "Open deze e-mail op het apparaat waarop Orvio staat en tik daar op de link.",
      failed: "Deze link werkt niet meer", failedText: "Hij is al gebruikt of te oud. Misschien is je adres al bevestigd: ga terug naar Orvio en log in. Lukt dat niet, vraag daar dan een nieuwe e-mail aan.",
      open: "Orvio openen"
    }
  };
  var say = /^nl\b/i.test(navigator.language || "") ? words.nl : words.en;
  var hash = location.hash.replace(/^#/, "");
  var values = {};
  hash.split("&").forEach(function (part) { var pair = part.split("="); if (pair.length === 2) values[pair[0]] = pair[1]; });
  var android = /android/i.test(navigator.userAgent);
  var open = document.getElementById("open");
  // Only a tap may open the app from a mail app's browser, so the app's address is a button and not a redirect.
  function offerApp() { open.href = "orvio://auth#" + hash; open.textContent = say.open; open.hidden = false; }
  if (values.error || values.error_code || values.error_description) {
    document.getElementById("mark").className = "mark problem";
    document.getElementById("mark").textContent = "!";
    document.getElementById("title").textContent = say.failed;
    document.getElementById("text").textContent = say.failedText;
  } else if (values.type === "recovery") {
    document.getElementById("mark").textContent = "🔑";
    document.getElementById("title").textContent = say.recovery;
    document.getElementById("text").textContent = android ? say.recoveryApp : say.recoveryOther;
    if (android) offerApp();
  } else {
    document.getElementById("title").textContent = say.confirmed;
    document.getElementById("text").textContent = say.confirmedText;
    if (android && values.refresh_token) offerApp();
  }
  // The address bar and a shared screenshot need not show the tokens.
  if (hash && history.replaceState) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
